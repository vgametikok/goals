<style>

    --bg:#f3f5f7; --panel:#ffffff; --panel2:#eaeef2; --line:#d7dee5;
    --ink:#1b2733; --ink2:#5a6b7b; --ink3:#8b9aa9;

      --bg:#12181f; --panel:#1a222b; --panel2:#212b36; --line:#2d3947;

  .wrap{max-width:1120px; margin:0 auto; padding:24px 20px 80px}

  .goalmeta{display:flex; gap:22px; flex-wrap:wrap; color:var(--ink2); font-size:13.5px}

  .tile.good .minibar i{background:var(--ok)}
  .tile.bad .minibar i{background:var(--bad)}

  table{width:100%; border-collapse:collapse; font-size:14px}

  .st-waiting{background:var(--warn-soft); color:var(--warn)}
  .st-paused{background:var(--bad-soft); color:var(--bad)}

  .muted{color:var(--ink2)}

  .veil .v{filter:blur(6px); user-select:none}

  .wk{width:74px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); padding:7px 8px; cursor:pointer; text-align:left}

  .wk.l4 .d{color:rgba(255,255,255,.75)}
  .wk.negw{background:var(--bad-soft)}
  .wk.future{opacity:.45}
  .wk.now{outline:2px solid var(--accent); outline-offset:1px}
  .wk.sel{outline:2px solid var(--gold); outline-offset:1px}
  .legend{display:flex; gap:14px; font-size:12.5px; color:var(--ink2); margin-top:12px; flex-wrap:wrap; align-items:center}
  .legend i{display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:5px; border:1px solid var(--line)}

  /* kanban / gantt */
  .viewtog{display:flex; gap:6px}
  .viewtog button.on{background:var(--accent); color:var(--accent-ink)}

  .kcol{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px}
  .kcol>h3{font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink3); margin-bottom:10px}
  .kcard{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px}
  .kcard.p3{border-left-color:var(--bad)} .kcard.p2{border-left-color:var(--gold)}
  .kcard .ctl{display:flex; gap:4px; align-items:center; margin-top:6px; flex-wrap:wrap}
  .kcard .tag{font-size:11.5px; color:var(--ink3)}
  .gantt .grow{display:grid; grid-template-columns:200px 108px 108px 1fr; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line)}
  .gantt .grow:last-child{border-bottom:none}

  .gbar{position:absolute; top:2px; bottom:2px; border-radius:5px; background:var(--accent); min-width:8px}

  .backlink{display:inline-block; margin-bottom:12px; color:var(--ink2)}
  .dirhead{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
  .dirhead input.dname{font-family:"Oswald",sans-serif; font-size:24px; font-weight:600; text-transform:uppercase; flex:1; min-width:220px}
  .mrow{display:flex; gap:8px; flex-wrap:wrap}
  .mcell{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-width:96px}
  .mcell .lbl{font-size:11px; color:var(--ink3); text-transform:uppercase; letter-spacing:.06em}
  .mcell .v2{font-weight:600; margin-top:2px}
  footer{color:var(--ink3); font-size:12.5px; text-align:center; margin-top:30px}
</style>

function uid(){ return Math.random().toString(36).slice(2,9); }
function today(){ return new Date().toISOString().slice(0,10); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }

/* ---------- migration v1 -> v2 ---------- */
const V1_PROJ_MAP = { raul:["yt","raul","Доктор Рауль"], asmr:["yt","asmr","АСМР Чееек"],
  cursed:["roblox","cursed","Clean the Cursed House"], ikea:["roblox","ikea","Escape Ikea"],
  solit:["html","solit","Солитёр"], kub:["html","kub","Кубария"] };
function migrate(s){
  if (!s) return null;
  if (s.v>=2){
    for (const k of ["directions","projects","tasks","income","expensesFixed","expensesAdhoc","debts","adjustments"])
      if (!Array.isArray(s[k])) s[k]=[];
    if (!s.goal.moveNeed){ s.goal.moveNeed=20000; s.goal.lifeNeed=(s.goal.target||30000)-20000; }
    return s;
  }
  const out = clone(DEFAULT_STATE);
  out.updated = s.updated||Date.now();
  if (s.goal){ out.goal.target=s.goal.target||30000; out.goal.deadline=s.goal.deadline||out.goal.deadline; out.goal.weeklyMin=s.goal.weeklyMin||700; out.goal.start=s.goal.start||out.goal.start; }
  // старые "проекты" v1: known ids уже разложены в дефолте; незнакомые становятся направлениями
  for (const p of (s.projects||[])){
    if (V1_PROJ_MAP[p.id]){
      const pr = out.projects.find(x=>x.id===p.id); if (pr) pr.status = p.status==="done"?"done":(p.status||pr.status);
    } else {
      const d = out.directions.find(x=>x.id===p.id);
      if (d){ d.prio=p.prio||d.prio; d.status=p.status||d.status; }
      else out.directions.push({ id:p.id, name:p.name||p.id, prio:p.prio||1, status:p.status||"active" });
    }
    if (p.next){
      const m = V1_PROJ_MAP[p.id];
      const dirId = m?m[0]:p.id, projId = m?m[1]:null;
      if (!out.tasks.some(t=>t.title===p.next)) out.tasks.push({ id:"m_"+p.id, dirId, projId, title:p.next, prio:p.prio||1, status:"todo" });
    }
  }
  if (Array.isArray(s.expenses) && s.expenses.length)
    out.expensesFixed = s.expenses.map(e=>({ id:e.id, title:e.title, amount:+e.amount||0 }));
  out.income = (s.income||[]).map(i=>{
    const m = V1_PROJ_MAP[i.project];
    return { id:i.id, date:i.date||"", title:i.title, dirId:m?m[0]:(i.project||""), projId:m?m[1]:null,
      amount:+i.amount||0, prob:+i.prob||0, status:i.status||"idea" };
  });
  out.v=2; return out;
}
function parseInline(){
  try{ const t=document.getElementById("state").textContent.trim();
    if (t && t!=="__STATE__") return JSON.parse(t); }catch(e){}
  return null;
}
function newest(a,b){ if(!a) return b; if(!b) return a; return (a.updated||0)>=(b.updated||0)?a:b; }
async function loadState(){
  let fileSt=null;
  try{ const r=await fetch("data/state.json",{cache:"no-store"}); if(r.ok) fileSt=await r.json(); }catch(e){}
  let localSt=null;
  try{ localSt=JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  state = migrate(newest(newest(parseInline(),fileSt),localSt)) || clone(DEFAULT_STATE);
}

/* ---------- lookups & math ---------- */
function dir(id){ return state.directions.find(d=>d.id===id); }
function proj(id){ return state.projects.find(p=>p.id===id); }
function incLabel(i){
  const d=dir(i.dirId), p=i.projId?proj(i.projId):null;
  return p ? (d?d.name+" / ":"")+p.name : (d?d.name:"—");
}
function mondayOf(x){ const d=new Date(x); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); d.setHours(0,0,0,0); return d; }
function addD(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtD(d){ return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0"); }
function inRange(iso,a,b){ if(!iso) return false; const d=new Date(iso+"T12:00"); return d>=a && d<b; }
function paidIn(a,b,dirId){
  return state.income.filter(i=>i.status==="paid" && inRange(i.date,a,b) && (!dirId || i.dirId===dirId))
    .reduce((s,i)=>s+ +i.amount,0);
}
function adhocIn(a,b){ return state.expensesAdhoc.filter(e=>inRange(e.date,a,b)).reduce((s,e)=>s+ +e.amount,0); }
function debtPayIn(a,b){
  let s=0; for(const d of state.debts) for(const p of (d.payments||[])) if(inRange(p.date,a,b)) s+=+p.amount;
  return s;
}
function paidTotal(dirId){ return state.income.filter(i=>i.status==="paid" && (!dirId||i.dirId===dirId)).reduce((s,i)=>s+ +i.amount,0); }
function weighted(dirId){
  return state.income.filter(i=>["idea","talks","invoiced"].includes(i.status) && (!dirId||i.dirId===dirId))
    .reduce((s,i)=>s+i.amount*(i.prob||0)/100,0);
}
function daysLeft(){ return Math.max(0,Math.ceil((new Date(state.goal.deadline+"T23:59:59")-new Date())/864e5)); }
function fixedMonthly(){
  const f = state.expensesFixed.reduce((s,e)=>s+ +e.amount,0);
  const b = state.debts.filter(d=>d.type==="bank").reduce((s,d)=>s+ +(d.monthly||0),0);
  return f+b;
}
function curWeek(){ const m=mondayOf(new Date()); return [m,addD(m,7)]; }
function curMonth(){ const a=new Date(); a.setDate(1); a.setHours(0,0,0,0); const b=new Date(a); b.setMonth(b.getMonth()+1); return [a,b]; }
function allWeeks(){
  const out=[]; let m=mondayOf(new Date(state.goal.start+"T12:00"));
  const end=new Date(state.goal.deadline+"T23:59:59");
  while(m<=end){ out.push(new Date(m)); m=addD(m,7); }
  return out;
}
function statusPill(st){ const l=(WORK_STATUSES.find(s=>s[0]===st)||["","?"])[1]; return '<span class="pill st-'+st+'">'+l+'</span>'; }
function sel(cls,cur,list,extra){
  return '<select class="slim '+cls+'"'+(extra||"")+'>'+list.map(([v,l])=>'<option value="'+v+'"'+(v===cur?" selected":"")+'>'+l+'</option>').join("")+'</select>';
}
function prioSel(cls,cur){
  return sel(cls,String(cur),[["3","приоритет: высокий"],["2","приоритет: средний"],["1","приоритет: низкий"]]);
}
function targetSel(cls,dirId,projId){
  let o='';
  for(const d of state.directions){
    o+='<option value="d:'+d.id+'"'+((dirId===d.id&&!projId)?" selected":"")+'>'+esc(d.name)+'</option>';
    for(const p of state.projects.filter(p=>p.dirId===d.id))
      o+='<option value="p:'+p.id+'"'+(projId===p.id?" selected":"")+'>&nbsp;&nbsp;— '+esc(p.name)+'</option>';
  }
  return '<select class="slim '+cls+'">'+o+'</select>';
}
function applyTarget(obj,val){
  if(val.startsWith("p:")){ const p=proj(val.slice(2)); obj.projId=p.id; obj.dirId=p.dirId; }
  else { obj.dirId=val.slice(2); obj.projId=null; }
}

/* ================= router / render ================= */
function route(){
  const h=location.hash;
  if (h.startsWith("#/dir/")) return {p:"dir", id:h.slice(6)};
  if (h.startsWith("#/weeks")) return {p:"weeks"};
  return {p:"main"};
}
function render(){
  const r=route();
  document.getElementById("nav").innerHTML =
    '<a href="#/" class="'+(r.p==="main"?"on":"")+'">Главная</a>'+
    '<a href="#/weeks" class="'+(r.p==="weeks"?"on":"")+'">Недели</a>'+
    (r.p==="dir"?'<a href="#/dir/'+r.id+'" class="on">'+esc((dir(r.id)||{}).name||"—")+'</a>':'');
  const app=document.getElementById("app");
  if (r.p==="weeks") app.innerHTML=vWeeks();
  else if (r.p==="dir"){ const d=dir(r.id); app.innerHTML = d?vDir(d):'<p class="muted">Направление не найдено. <a href="#/">На главную</a></p>'; }
  else app.innerHTML=vMain();
}

    <div class="head"><span class="name">${esc(d.name)}</span>${statusPill(d.status)}</div>
    <div class="row2" data-stop>
      ${prioSel("dir-prio",d.prio).replace("<select",'<select data-dir="'+d.id+'"')}
      ${sel("dir-st",d.status,WORK_STATUSES,' data-dir="'+d.id+'"')}

    ${t?'<div class="next">→ '+esc(t.title)+'</div>':''}
    <div class="inc num">неделя ${fmt(paidIn(wa,wb,d.id))} · месяц ${fmt(paidIn(ma,mb,d.id))} · всего ${fmt(paidTotal(d.id))}</div>
  </div>`;
}

/* ---------- weeks page ---------- */
function vWeeks(){
  const weeks=allWeeks(); const now=mondayOf(new Date()).getTime();
  const min=state.goal.weeklyMin;
  const sq=weeks.map(m=>{
    const a=m, b=addD(m,7);
    const inc=paidIn(a,b), out=adhocIn(a,b)+debtPayIn(a,b), net=inc-out;
    let cls="";
    if(m.getTime()>now) cls="future";
    else if(net<0) cls="negw";
    else if(inc>0){ const r=inc/min; cls = r>=3?"l4":r>=1.5?"l3":r>=1?"l2":"l1"; }
    if(m.getTime()===now) cls+=" now";
    if(selWeek===m.toISOString().slice(0,10)) cls+=" sel";
    return `<button class="wk ${cls}" data-wk="${m.toISOString().slice(0,10)}">
      <div class="d">${fmtD(a)}–${fmtD(addD(b,-1))}</div>
      <div class="n num">${inc||out?((net>=0?"+":"−")+"$"+Math.abs(Math.round(net)).toLocaleString("ru-RU")):"·"}</div>
    </button>`;
  }).join("");

  let detail='<p class="muted">Нажми на неделю, чтобы увидеть сводку.</p>';
  if(selWeek){

function vKanban(d){
  const ts=state.tasks.filter(t=>t.dirId===d.id);
  return '<div class="kanban">'+TASK_COLS.map(([st,label],ci)=>{
    const cards=ts.filter(t=>t.status===st).sort((a,b)=>b.prio-a.prio).map(t=>{
      const p=t.projId?proj(t.projId):null;
      return `<div class="kcard p${t.prio}" data-id="${t.id}">
        <input class="inline" data-f="title" value="${esc(t.title)}">
        ${p?'<div class="tag">'+esc(p.name)+'</div>':''}
        <div class="ctl">
          ${sel("task-prio",String(t.prio),[["3","высокий"],["2","средний"],["1","низкий"]])}
          ${ci>0?'<button class="mv" data-mv="-1" title="Назад">◀</button>':''}
          ${ci<2?'<button class="mv" data-mv="1" title="Вперёд">▶</button>':''}
          <button class="x" data-del="tasks">×</button>
        </div></div>`;
    }).join("");
    return '<div class="kcol"><h3>'+label+'</h3>'+(cards||'<p class="muted" style="font-size:13px">—</p>')+'</div>';
  }).join("")+'</div>';
}
function vGantt(d){
  const ts=state.tasks.filter(t=>t.dirId===d.id);
  const dated=ts.filter(t=>t.start&&t.due);
  let scale="";
  let min=null,max=null;
  if(dated.length){
    min=new Date(Math.min(...dated.map(t=>+new Date(t.start))));
    max=new Date(Math.max(...dated.map(t=>+new Date(t.due))));
    max=addD(max,1);
    scale='<div class="gscale"><span>'+fmtD(min)+'</span><span>'+fmtD(addD(max,-1))+'</span></div>';
  }
  const row=t=>{
    let bar='<span class="muted" style="font-size:12px">укажи даты →</span>';
    if(t.start&&t.due&&min){
      const total=max-min||1;
      const l=Math.max(0,(new Date(t.start)-min)/total*100);
      const w=Math.max(2,(addD(new Date(t.due),1)-new Date(t.start))/total*100);
      bar='<div class="gtrack"><div class="gbar p'+t.prio+'" style="left:'+l+'%;width:'+Math.min(w,100-l)+'%"></div></div>';
    } else bar='<div class="gtrack"></div>';
    return `<div class="grow" data-id="${t.id}">
      <input class="inline" data-f="title" value="${esc(t.title)}">
      <input class="num" data-f="start" type="date" value="${t.start||""}">
      <input class="num" data-f="due" type="date" value="${t.due||""}">
      ${bar}</div>`;
  };
  return '<div class="gantt">'+scale+(ts.length?ts.map(row).join(""):'<p class="muted">Задач нет.</p>')+'</div>';
}

function chip(cls,text){ const c=document.getElementById("savechip"); c.className="savechip "+cls; c.textContent=text; }
function touch(rerender){
  state.updated=Date.now(); dirty=true;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  chip("dirty","Есть изменения…");
  if(rerender) render();
  clearTimeout(saveTimer); saveTimer=setTimeout(cloudSave, 2500);
}
async function cloudSave(){
  if(!dirty) return;
  if(!artifactNS && supaMode){
    chip("saving","Сохраняю…");
    try{ await supaPush(); dirty=false; chip("","В облаке ✓"); }
    catch(e){ chip("local","Сохранено локально (нет сети?)"); dirty=false; }
    return;
  }
  if(!artifactNS){ chip("local","Сохранено локально"); dirty=false; return; }
  chip("saving","Сохраняю…");
  const json=JSON.stringify(state).replace(/</g,"\\u003c");
  try{
    await artifactNS.publish({ "data/state.json": { content: json, contentType:"application/json" } });
    dirty=false; chip("","Сохранено ✓");
  }catch(err){
    const code=err&&err.code;
    if(code==="conflict"){ return; }
    if(code==="capability_disabled"||code==="read_only_path"){
      try{
        const src=await (await fetch("index.html")).text();
        const html=src.replace(/(<script type="application\/json" id="state">)[\s\S]*?(<\/script>)/,"$1"+json+"$2");
        await artifactNS.publish(html.startsWith("<!doctype")?html:"<!doctype html>\n"+html);
        dirty=false; return;
      }catch(e2){ chip("local","Сохранено локально"); dirty=false; return; }
    }
    if(code==="not_writer"||code==="not_granted"){ artifactNS=null; chip("local","Сохранено локально"); dirty=false; return; }
    chip("local","Сохранено локально"); dirty=false;
  }
}

/* ---------- Supabase sync (версия-сайт) ---------- */
function getSyncKey(){
  const m = location.search.match(/[?&]k=([A-Za-z0-9_-]{24,})/);
  if (m){ try{ localStorage.setItem("u30_key", m[1]); }catch(e){} return m[1]; }
  let k = null;
  try{ k = localStorage.getItem("u30_key"); }catch(e){}
  if (!k){
    const a = new Uint8Array(24); crypto.getRandomValues(a);
    k = Array.from(a, b=>"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-"[b&63]).join("");
    try{ localStorage.setItem("u30_key", k); }catch(e){}
  }
  return k;
}
async function supaRpc(fn, body){
  const r = await fetch(SUPA.url+"/rest/v1/rpc/"+fn, {
    method:"POST",
    headers:{ "apikey":SUPA.key, "Authorization":"Bearer "+SUPA.key, "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("supabase "+r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function supaLoadMerge(){
  const remote = migrate(await supaRpc("goals_get", { p_k: supaKey }));
  if (remote && (remote.updated||0) > (state.updated||0)){ state = remote; render(); }
  else if (remote===null || (state.updated||0) > (remote?.updated||0)){ await supaPush(); }
}
async function supaPush(){
  await supaRpc("goals_set", { p_k: supaKey, p_data: state, p_updated: state.updated||0 });
}
function syncUrl(){ return location.origin + location.pathname + "?k=" + supaKey; }

  catch(e){ prompt("Ссылка для других устройств:", syncUrl()); }

});

    if(ns){ artifactNS=ns; chip("","Синхронизация ✓"); if(dirty) cloudSave(); return; }
  }
  /* версия-сайт: облако через Supabase по секретному ключу */

  }
})();
